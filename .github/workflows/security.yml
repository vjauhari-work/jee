name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-scan so new advisories surface without a code change
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gosec:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      # G104 (unhandled errors) is excluded as a lint-level concern;
      # everything else fails the build.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104 ./...

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: semgrep scan
        run: >
          semgrep scan --error --metrics=off
          --config p/golang
          --config p/typescript
          --config p/react
          --config p/security-audit
          --config p/secrets
          --config p/dockerfile

  govulncheck:
    name: Dependency vulnerabilities (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  npm-audit:
    name: Dependency vulnerabilities (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Gate on production dependencies only; dev-tool advisories
      # don't ship to users.
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
