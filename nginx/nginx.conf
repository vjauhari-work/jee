worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # When a TLS proxy (Caddy, see docker-compose.prod.yml) fronts this
    # server, the connection arrives from the docker network, so recover
    # the real client IP from X-Forwarded-For. Only private ranges are
    # trusted; direct internet clients can't spoof it in production
    # because only Caddy is publicly exposed there.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # API proxy
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded images. Setting Cache-Control here discards the
        # server-level headers, so the shared set is re-included.
        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            expires 30d;
            # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
