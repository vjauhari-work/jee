# Shared security headers. nginx's add_header inheritance is all-or-
# nothing: any add_header inside a location block discards everything
# set at server level, so every location that sets its own headers must
# include this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
